<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#0891b2" stroke="#0e7490" stroke-width="1"/>
  
  <!-- Calendar grid -->
  <rect x="8" y="9" width="16" height="14" rx="1.5" fill="white" opacity="0.95"/>
  
  <!-- Calendar header -->
  <rect x="8" y="9" width="16" height="3" rx="1.5" fill="#0e7490"/>
  
  <!-- Grid lines (weaving pattern) -->
  <line x1="12" y1="13" x2="12" y2="23" stroke="#0891b2" stroke-width="0.8" opacity="0.6"/>
  <line x1="16" y1="13" x2="16" y2="23" stroke="#0891b2" stroke-width="0.8" opacity="0.6"/>
  <line x1="20" y1="13" x2="20" y2="23" stroke="#0891b2" stroke-width="0.8" opacity="0.6"/>
  
  <line x1="8" y1="15.5" x2="24" y2="15.5" stroke="#0891b2" stroke-width="0.8" opacity="0.6"/>
  <line x1="8" y1="18.5" x2="24" y2="18.5" stroke="#0891b2" stroke-width="0.8" opacity="0.6"/>
  <line x1="8" y1="21" x2="24" y2="21" stroke="#0891b2" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Checkmark (task completion) -->
  <path d="M13 17 L15 19 L19 14" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
